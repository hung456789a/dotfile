# ~/.config/tmux/tmux.conf

# --- General ---
set -s set-clipboard on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -g mouse on
set -g repeat-time 1000
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# --- Status bar ---
set -g status on
set -g status-position top

# --- Prefix (mặc định C-b, bỏ comment nếu muốn dùng C-a) ---
#set -g prefix C-a
#unbind C-b
#bind C-a send-prefix

# split dễ nhớ
bind v split-window -h -c "#{pane_current_path}"
bind s split-window -v -c "#{pane_current_path}"

# chuyển pane
bind -r i select-pane -U   # lên
bind -r k select-pane -D   # xuống
bind -r j select-pane -L   # trái
bind -r l select-pane -R   # phải

# resize pane
bind -r I resize-pane -U 5
bind -r K resize-pane -D 5
bind -r J resize-pane -L 5
bind -r L resize-pane -R 5

# reload config
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# --- Popups ---
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"                 # terminal popup
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" "lazygit"       # lazygit
bind C-k display-popup -E -w 90% -h 90% "~/.tmux/scripts/kube-popup.sh"         # k9s + chọn context
bind C-g display-popup -E -w 80% -h 80% -d "#{pane_current_path}" "~/.tmux/scripts/gitlab-popup.sh"  # glab menu
bind C-p display-popup -E -w 70% -h 70% "~/.tmux/scripts/prometheus-popup.sh"   # prometheus port-forward

# --- Plugins (TPM) ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'joshmedeski/tmux-nerd-font-window-name'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# catppuccin
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'

# resurrect / continuum
set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'

# TPM (giữ ở cuối file)
setenv -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.config/tmux/plugins/"
run '~/.config/tmux/plugins/tpm/tpm'
